<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELORIA</title><style>body{margin:0;background:#090909;color:#f7f2e8;font-family:Arial}header{padding:25px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #333}.logo{font:34px Georgia;color:#d7b36a;letter-spacing:6px}a{color:#ddd;text-decoration:none;margin:10px}.hero{text-align:center;padding:110px 20px;background:radial-gradient(circle,#3b2d1d,#090909 60%)}h1{font:70px Georgia;margin:20px}.gold{color:#d7b36a}.grid{padding:50px 7%;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:25px}.card{background:#151515;border:1px solid #333;padding:15px}.media{height:280px;background:#222;display:flex;align-items:center;justify-content:center}.media img,.media video{max-width:100%;max-height:100%}.card h2{font-family:Georgia}.btn{display:inline-block;border:1px solid #d7b36a;padding:13px 20px;color:#d7b36a}.empty{text-align:center;grid-column:1/-1;padding:50px;color:#999}</style></head><body><header><div class=logo>VELORIA</div><nav><a href="index.html">Collection</a><a href="order.html">Order</a><a href="admin.html">Admin</a></nav></header><section class=hero><div class=gold>JEWELRY • COSMETICS</div><h1>Luxury Beyond Beauty.</h1><p>Discover our curated collection.</p></section><main id=products class=grid></main><script>let p=JSON.parse(localStorage.vp||'[]');let box=document.querySelector('#products');if(!p.length)box.innerHTML='<div class=empty>Products will appear here when you add them from Admin.</div>';p.forEach(x=>{let m=x.video?`<video src="${x.video}" controls></video>`:x.image?`<img src="${x.image}">`:'No image';box.innerHTML+=`<article class=card><div class=media>${m}</div><h2>${x.name}</h2><div class=gold>${x.price||'Price on request'}</div><p>${x.description||''}</p><a class=btn href="order.html?p=${encodeURIComponent(x.name)}">Request Product</a></article>`})</script></body></html>
