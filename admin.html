<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELORIA Admin</title><style>body{background:#0b0b0b;color:#eee;font-family:Arial;padding:25px}.box{max-width:850px;margin:auto;background:#151515;padding:30px;border:1px solid #333}input,textarea,select{width:100%;padding:12px;margin:6px 0 15px;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #444}button{padding:12px 18px;background:#d7b36a;border:0;margin:5px}.item{border-top:1px solid #333;padding:15px 0}.danger{background:#8d3333;color:#fff}</style></head><body><div class=box><h1>VELORIA ADMIN</h1><section id=login><input id=u placeholder=Username><input id=p type=password placeholder=Password><button onclick=login()>LOGIN</button><p>First login: admin / veloria123</p></section><section id=app style="display:none"><h2>Add Product</h2><input id=n placeholder="Product name"><select id=c><option>Jewelry</option><option>Cosmetics</option></select><input id=pr placeholder="Price"><textarea id=d placeholder="Description"></textarea><label>Picture</label><input id=im type=file accept="image/*"><label>Video</label><input id=vi type=file accept="video/*"><button onclick=add()>ADD PRODUCT</button><h2>Products</h2><div id=list></div><h2>Customer Requests</h2><div id=orders></div><h2>Settings</h2><input id=nu placeholder="New username"><input id=np type=password placeholder="New password"><input id=wa placeholder="WhatsApp number (optional)"><button onclick=settings()>SAVE SETTINGS</button></section></div><script>const $=x=>document.getElementById(x);function login(){if(u.value===(localStorage.user||'admin')&&p.value===(localStorage.pass||'veloria123')){loginSec=0;$('login').style.display='none';$('app').style.display='block';render()}else alert('Incorrect login')}function file(f){return new Promise(r=>{if(!f)return r('');let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}async function add(){if(!n.value)return alert('Enter product name');let a=JSON.parse(localStorage.vp||'[]');a.push({id:Date.now(),name:n.value,category:c.value,price:pr.value,description:d.value,image:await file(im.files[0]),video:await file(vi.files[0])});localStorage.vp=JSON.stringify(a);render();alert('Product added')}function render(){let a=JSON.parse(localStorage.vp||'[]');list.innerHTML=a.map(x=>`<div class=item><b>${x.name}</b> — ${x.category}<button class=danger onclick="del(${x.id})">DELETE</button></div>`).join('')||'No products yet';let o=JSON.parse(localStorage.vo||'[]');orders.innerHTML=o.map(x=>`<div class=item><b>${x.product}</b><br>Name: ${x.name}<br>Phone: ${x.phone}<br>Qty: ${x.qty}<br>Address: ${x.address}<br>${x.date}</div>`).join('')||'No requests yet'}function del(id){localStorage.vp=JSON.stringify(JSON.parse(localStorage.vp||'[]').filter(x=>x.id!==id));render()}function settings(){if(nu.value)localStorage.user=nu.value;if(np.value)localStorage.pass=np.value;if(wa.value)localStorage.wa=wa.value;alert('Saved')} </script></body></html>
