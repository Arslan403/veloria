<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELORIA Order</title><style>body{background:#0b0b0b;color:#eee;font-family:Arial;padding:30px}.box{max-width:650px;margin:auto;background:#151515;padding:30px;border:1px solid #333}input,textarea{width:100%;padding:13px;margin:7px 0 18px;background:#0b0b0b;color:#fff;border:1px solid #444;box-sizing:border-box}button{padding:15px;width:100%;background:#d7b36a;border:0}</style></head><body><div class=box><h1>VELORIA Order Request</h1><p>Your request is private. We will contact you by phone.</p><form onsubmit="send(event)"><label>Product</label><input id=product required><label>Name</label><input id=name required><label>Contact number</label><input id=phone required><label>Quantity</label><input id=qty type=number min=1 value=1 required><label>Address</label><textarea id=address required></textarea><button>SUBMIT REQUEST</button></form><p id=msg></p></div><script>product.value=new URLSearchParams(location.search).get('p')||'';function send(e){e.preventDefault();let a=JSON.parse(localStorage.vo||'[]');a.push({product:product.value,name:name.value,phone:phone.value,qty:qty.value,address:address.value,date:new Date().toLocaleString()});localStorage.vo=JSON.stringify(a);e.target.reset();msg.textContent='Request received. We will contact you personally.'}</script></body></html>
